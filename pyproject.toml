[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hw3cv"
version = "0.1.0"
description = "Code scaffold for CV HW3: 2DGS/AIGC scene fusion and LeRobot ACT CALVIN generalization."
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
